name: Build AMINA FDS (exécutable + installateur Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler l'exécutable (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name AMINA_FDS --icon assets\icon.ico main.py

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Générer l'installateur Windows (Setup.exe avec icône Bureau)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publier les fichiers compilés (artefacts du workflow)
        uses: actions/upload-artifact@v4
        with:
          name: AMINA_FDS_Windows
          path: |
            dist/AMINA_FDS.exe
            installer_output/AMINA_FDS_Setup.exe

      - name: Créer une Release GitHub (si un tag v* est poussé)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/AMINA_FDS_Setup.exe
            dist/AMINA_FDS.exe
