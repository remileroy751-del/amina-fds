name: Compiler AMINA_FDS.exe

# Quand ce workflow se déclenche automatiquement :
on:
  push:
    branches: [ "main" ]      # à chaque envoi (push) sur la branche main
    tags:
      - "v*"                  # aussi quand tu crées un tag de version, ex: v1.0
  workflow_dispatch:          # + bouton "Run workflow" manuel dans l'onglet Actions

jobs:
  build-windows:
    runs-on: windows-latest    # on compile sur une machine Windows fournie par GitHub

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler l'exécutable avec PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "AMINA_FDS" main.py

      - name: Copier le dossier assets à côté de l'exécutable
        run: |
          if (Test-Path assets) {
            Copy-Item -Path assets -Destination dist\assets -Recurse -Force
          }
        shell: pwsh

      - name: Publier l'exécutable comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: AMINA_FDS_windows
          path: dist/
          if-no-files-found: error

      - name: Créer une Release GitHub (uniquement si un tag v* est poussé)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AMINA_FDS.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
